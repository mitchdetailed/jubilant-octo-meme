#
# aqtinstall settings for the Windows Qt installs of ci.yml (qt-app) and package.yml (windows), passed as AQT_CONFIG
# and read on top of aqtinstall's own settings.ini (D-217). With --external 7z each archive of the kit is extracted
# by a 7-Zip process of its own into the kit folder (-o<outputdir>/<version>/<arch>), and with aqtinstall's default
# of 4 workers those processes raced to create that folder ("Cannot create output directory : ... already exists",
# package.yml's first run on PR #5). One worker downloads and extracts the archives one after another.
[aqt]
concurrency : 1
